# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/pkb
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=8081

#Microservice URL
backend.service.url.api=http://localhost:8081

python.service.url.api=http://localhost:8080

# API Endpoint config

api.endpoint.backend=/api/v1

# Global Context Configuration

ai.context.recent-token-budget=6000
ai.context.semantic-token-budget=1500
ai.context.max-completion-tokens=4000
ai.context.summary-token-budget=1500
ai.context.summarization-trigger=3000
ai.context.input-safety-margin=500

