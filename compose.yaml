services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    container_name: pkb-postgres

    environment:
      POSTGRES_DB: pkb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  postgres_data: